# Actual PC converter, shared-assets importer and CPU scene-capture adapters with Apple XCTest.
# Isolated blank UIKit app: no renderer archive, bridge, Steam, devices or real assets.
name: WMPCIntegrationHarness
options:
  bundleIdPrefix: com.rayray1099.wallpapermachine
  deploymentTarget:
    iOS: "18.0"
  # Explicit virtual groups avoid XcodeGen re-rooting ../Unit and ../Support twice.
  createIntermediateGroups: false
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTED_PLATFORMS: iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  WMPCIntegrationHarness:
    type: application
    platform: iOS
    sources:
      - path: PCIntegrationApp.swift
      - path: ../../Sources/Models/WallpaperModels.swift
        group: ProductionSources
      - path: ../../Sources/Export/PCConverterConnection.swift
        group: ProductionSources
      - path: ../../Sources/Export/PCConverterClient.swift
        group: ProductionSources
      - path: ../../Sources/Export/PCConverterView.swift
        group: ProductionSources
      - path: ../../Sources/Export/ExportDevice.swift
        group: ProductionSources
      - path: ../../Sources/Export/ExportGeometry.swift
        group: ProductionSources
      - path: ../../Sources/Export/WallpaperExportSettings.swift
        group: ProductionSources
      - path: ../../Sources/Export/TendiesScreenClass.swift
        group: ProductionSources
      - path: ../../Sources/Export/TendiesManifest.swift
        group: ProductionSources
      - path: ../../Sources/Export/KeyedArchiveBuilder.swift
        group: ProductionSources
      - path: ../../Sources/Export/ZipArchiveWriter.swift
        group: ProductionSources
      - path: ../../Sources/Renderer/SceneSharedAssetsInstaller.swift
        group: ProductionSources
      - path: ../../Sources/Renderer/SceneSharedAssetsView.swift
        group: ProductionSources
      - path: ../../Sources/Media/MediaFrame.swift
        group: ProductionSources
      - path: ../../Sources/Export/WallpaperFrameProvider.swift
        group: ProductionSources
      - path: ../../Sources/Export/MediaCaptureFrameProvider.swift
        group: ProductionSources
      - path: ../../Sources/Export/LiveCaptureTiming.swift
        group: ProductionSources
      - path: ../../Sources/Renderer/SceneNativeFrameCapture.swift
        group: ProductionSources
      - path: ../../Sources/Export/SceneWallpaperExportProvider.swift
        group: ProductionSources
      - path: ../../Sources/Renderer/OfflineSceneFrameCapture.swift
        group: ProductionSources
      - path: ../../Sources/Export/OfflineSceneWallpaperExportProvider.swift
        group: ProductionSources
      - path: ../../Sources/Export/FrameCompositor.swift
        group: ProductionSources
      - path: ../../Sources/Export/TendiesExportWriter.swift
        group: ProductionSources
    dependencies:
      - package: ZIPFoundation
      - sdk: CryptoKit.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: Combine.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
    settings:
      base:
        PRODUCT_NAME: WMPCIntegrationHarness
        PRODUCT_MODULE_NAME: WallpaperMachineIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.rayray1099.wallpapermachine.ios.pcintegrationharness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  WMPCIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Unit/Export/PCConverterClientTests.swift
        group: NativeTests
      - path: ../Unit/Renderer/SceneSharedAssetsInstallerTests.swift
        group: NativeTests
      - path: ../Unit/Export/SceneWallpaperExportTests.swift
        group: NativeTests
      - path: ../Unit/Export/OfflineSceneWallpaperExportTests.swift
        group: NativeTests
      - path: ../Unit/Export/TendiesProviderExportTests.swift
        group: NativeTests
      - path: ../Support/IOSTestSupport.swift
        group: NativeTests
    dependencies:
      - target: WMPCIntegrationHarness
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: WMPCIntegrationTests
        PRODUCT_BUNDLE_IDENTIFIER: com.rayray1099.wallpapermachine.ios.pcintegrationharness.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WMPCIntegrationHarness.app/WMPCIntegrationHarness"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WMPCIntegrationHarness:
    build:
      targets:
        WMPCIntegrationHarness: all
        WMPCIntegrationTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: WMPCIntegrationTests
          parallelizable: false
          randomExecutionOrder: false

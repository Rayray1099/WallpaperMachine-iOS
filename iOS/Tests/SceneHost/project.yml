# Isolated UIKit component tests: actual SceneWallpaperView, mocked native C ABI.
# No production app startup, renderer archives, Steam transport or Swift packages.
name: WMSceneHostHarness
options:
  bundleIdPrefix: com.rayray1099.wallpapermachine
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTED_PLATFORMS: iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/SceneHostTestBridge.h"
    HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../../../Renderer/Engine/src/Platform/Apple"]
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  WMSceneHostHarness:
    type: application
    platform: iOS
    sources:
      - path: SceneHostHarnessApp.swift
      - path: SceneHostNativeStub.c
      - path: ../../Sources/Renderer/SceneWallpaperView.swift
      - path: ../../Sources/Renderer/SceneNativeFrameCapture.swift
      - path: ../../Sources/Media/MediaFrame.swift
      - path: ../../Sources/Renderer/SceneSharedAssetsCoordinator.swift
      - path: ../../Sources/Renderer/SceneResourceDirectories.swift
      - path: ../../Sources/Renderer/SceneSurfaceGeometry.swift
      - path: ../../Sources/Renderer/SceneStartupWait.swift
      - path: ../../Sources/Renderer/SceneHostSession.swift
      - path: ../../Sources/Renderer/SceneWallpaperPropertyJSON.swift
      - path: ../../Sources/Models/WallpaperModels.swift
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
    settings:
      base:
        PRODUCT_NAME: WMSceneHostHarness
        PRODUCT_MODULE_NAME: WMSceneHostHarness
        PRODUCT_BUNDLE_IDENTIFIER: com.rayray1099.wallpapermachine.ios.scenehostharness
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "WM_SCENE_HOST_TESTING=1"]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  WMSceneHostLifecycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SceneHostLifecycleTests.swift
    dependencies:
      - target: WMSceneHostHarness
    settings:
      base:
        PRODUCT_NAME: WMSceneHostLifecycleTests
        PRODUCT_BUNDLE_IDENTIFIER: com.rayray1099.wallpapermachine.ios.scenehostharness.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WMSceneHostHarness.app/WMSceneHostHarness"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WMSceneHostHarness:
    build:
      targets:
        WMSceneHostHarness: all
        WMSceneHostLifecycleTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: WMSceneHostLifecycleTests
          parallelizable: false
          randomExecutionOrder: false

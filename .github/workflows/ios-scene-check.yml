# Host-executed regression for the scene engine shared with the iOS app.
# This does not launch/build the app or claim physical iPad presentation coverage.
name: iOS Scene Startup (native macOS)

on:
  workflow_dispatch:
  push:
    branches: [ios/main]
    paths:
      - "Renderer/**"
      - "ThirdParty/**"
      - "scripts/ios/check_scene_startup.sh"
      - "scripts/ios/make_native_scene_fixture.py"
      - "scripts/tests/test_ios_*.py"
      - ".github/workflows/ios-scene-check.yml"
  pull_request:
    branches: [ios/main]
    paths:
      - "Renderer/**"
      - "ThirdParty/**"
      - "scripts/ios/check_scene_startup.sh"
      - "scripts/ios/make_native_scene_fixture.py"
      - "scripts/tests/test_ios_*.py"
      - ".github/workflows/ios-scene-check.yml"

permissions:
  contents: read

concurrency:
  group: ios-scene-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-scene-startup:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      CCACHE_DIR: ${{ github.workspace }}/artifacts/ios-scene-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: "%compiler% -v"
      CCACHE_MAXSIZE: "1G"
      SCENE_ARTIFACTS: ${{ github.workspace }}/artifacts/ios-scene-startup/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify native arm64 host and install macOS-only dependencies
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          # The runner's default Xcode 16.4 SDK lacks std::jthread/stop_token.
          # Match ci_setup.sh: use the newest installed stable Xcode, not the
          # machine-wide xcode-select default, and preserve it in later steps.
          xcode_app="$(python3 -c 'import pathlib,re; apps=[p for p in pathlib.Path("/Applications").glob("Xcode*.app") if re.fullmatch(r"Xcode_\d+(?:\.\d+)*\.app",p.name) and (p/"Contents/Developer").is_dir()]; version=lambda p: tuple(map(int,re.findall(r"\d+",p.name))); print(max(apps,key=version)) if apps else None')"
          test -n "$xcode_app"
          export DEVELOPER_DIR="${xcode_app}/Contents/Developer"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "$GITHUB_ENV"
          printf 'Selected native toolchain: %s\n' "$DEVELOPER_DIR"
          xcrun --sdk macosx --show-sdk-version
          xcodebuild -version
          # These are HOST dependencies, never linked into the iOS device archive.
          for formula in cmake ninja pkg-config ccache quickjs-ng freetype lz4 nlohmann-json argparse; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install --quiet "$formula"
            fi
          done
          # Match Renderer/rust-toolchain.toml. Only wm-shader is compiled, not
          # Core/Bridge or the application. rustup resolves the workspace file.
          cd Renderer
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Restore isolated host compiler caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Renderer/target/release
            artifacts/ios-scene-cache/ccache
          key: ios-scene-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Renderer/Cargo.lock', 'Renderer/rust-toolchain.toml', 'ThirdParty/provenance.json', 'scripts/ios/check_scene_startup.sh') }}
          restore-keys: |
            ios-scene-host-${{ runner.os }}-${{ runner.arch }}-

      - name: Test fixture formats and honest test verdicts
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_ios_*.py' -v

      - name: Execute actual CPU loader and gated native renderer regressions
        run: bash scripts/ios/check_scene_startup.sh --artifacts-dir "${SCENE_ARTIFACTS}"

      - name: Upload native test reports and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scene-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SCENE_ARTIFACTS }}/*.log
            ${{ env.SCENE_ARTIFACTS }}/*.json
            ${{ env.SCENE_ARTIFACTS }}/summary.md
            ${{ env.SCENE_ARTIFACTS }}/fixture/WM-QA-Native-Quadrants.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Report pre-test infrastructure failure honestly
        if: always()
        run: |
          if [ ! -f "${SCENE_ARTIFACTS}/report.json" ]; then
            echo "## Native scene startup: no test verdict" >> "$GITHUB_STEP_SUMMARY"
            echo "Runner/dependency setup did not reach the native tests. No CPU or GPU pass is claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
